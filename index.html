<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub - Event Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <div class="logo">Event<span>Hub</span></div>
      <div class="links">
        <a href="#events">Events</a>
        <a href="#registrations">My Registrations</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="tag">EVENT MANAGEMENT SYSTEM</p>
        <h1>Discover. Register. <span>Experience.</span></h1>
        <p>Find upcoming college events and register in a few clicks.</p>
        <a class="btn" href="#events">Explore Events</a>
      </div>
    </section>

    <section id="events" class="section">
      <div class="section-head">
        <div>
          <p class="tag">UPCOMING EVENTS</p>
          <h2>Choose an event</h2>
        </div>
        <input id="searchInput" type="search" placeholder="Search events...">
      </div>
      <div id="eventGrid" class="grid"></div>
    </section>

    <section id="registrations" class="section">
      <div class="section-head">
        <div>
          <p class="tag">YOUR ACTIVITY</p>
          <h2>My Registrations</h2>
        </div>
      </div>
      <div id="registrationList" class="registration-list"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="close" onclick="closeModal()">×</button>
      <h2 id="modalTitle">Register</h2>
      <p id="modalInfo"></p>
      <form id="registrationForm">
        <input id="name" type="text" placeholder="Full Name" required>
        <input id="email" type="email" placeholder="Email Address" required>
        <input id="phone" type="tel" placeholder="Phone Number" required>
        <button class="btn" type="submit">Confirm Registration</button>
      </form>
      <p id="successMessage" class="success"></p>
    </div>
  </div>

  <footer>
    <p>EventHub • DevOps Case Study</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
